<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitCore - 404 Zone Unreachable</title>
  
  <!-- Google Fonts: Montserrat for athletic & modern styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
   <script src="tailwind.js"></script>

  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
          },
          colors: {
            gym: {
              brand: '#EF4444',       // Energetic brand red
              brandHover: '#DC2626',  // Hover brand red
              darkBg: '#09090B',      // Zinc-950 dark background
              darkCard: '#18181B',    // Zinc-900 card background
              darkBorder: '#27272A',  // Zinc-800 border
              lightBg: '#FAFAFA',     // Neutral-50 light background
              lightCard: '#FFFFFF',   // Pure white card
              lightBorder: '#E5E5E5', // Light border
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent layout shift during theme loading */
    .theme-loading * {
      transition: none !important;
    }

    /* Global viewport layout reset to prevent horizontal scrolling */
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    *, *:before, *:after {
      box-sizing: border-box;
    }

    /* Responsive images */
    img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  
    /* --- STRICT MOBILE RESPONSIVE SAFEGUARDS --- */
    html {
      font-size: 14px;
    }
    @media (min-width: 768px) {
      html {
        font-size: 15px;
      }
    }
    @media (min-width: 1024px) {
      html {
        font-size: 16px;
      }
    }

    /* Wrap long words to prevent overflow scrolling */
    p, span, h1, h2, h3, h4, h5, h6, a, button, label, input, select, textarea {
      overflow-wrap: break-word;
      word-break: break-word;
    }

    /* Prevent horizontal scrolling on mobile */
    html, body {
      max-width: 100vw !important;
      overflow-x: hidden !important;
      box-sizing: border-box !important;
    }

    /* Mobile spacing optimizations */
    @media (max-width: 480px) {
      .py-20 {
        padding-top: 3.5rem !important;
        padding-bottom: 3.5rem !important;
      }
      .py-16 {
        padding-top: 3rem !important;
        padding-bottom: 3rem !important;
      }
      .py-12 {
        padding-top: 2rem !important;
        padding-bottom: 2rem !important;
      }
      .gap-12 {
        gap: 1.75rem !important;
      }
      .gap-8 {
        gap: 1.25rem !important;
      }
    }
</style>

  <script>
    // Inline blocking script to set theme & dir immediately to prevent page flash
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      const savedDir = localStorage.getItem('dir') || 'ltr';
      document.documentElement.setAttribute('dir', savedDir);
      document.documentElement.setAttribute('lang', savedDir === 'rtl' ? 'ar' : 'en');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-gym-lightBg text-zinc-800 dark:bg-gym-darkBg dark:text-zinc-200 min-h-screen flex flex-col justify-center items-center transition-colors duration-300 font-sans p-4 sm:p-6 relative">

  <!-- Floating Theme & RTL Controls -->
  <div class="absolute top-4 end-4 flex items-center space-x-2 rtl:space-x-reverse z-50">
    <!-- Dark Mode Toggle Button -->
    <button id="theme-toggle" class="p-2.5 rounded-xl bg-gym-lightCard dark:bg-gym-darkCard border border-gym-lightBorder dark:border-gym-darkBorder text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-white shadow-sm transition-all duration-200 focus:outline-none" title="Toggle Dark/Light Mode" aria-label="Toggle dark mode">
      <!-- Sun Icon (Show when dark) -->
      <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle>
  <line x1="12" y1="1" x2="12" y2="3"></line>
  <line x1="12" y1="21" x2="12" y2="23"></line>
  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
  <line x1="1" y1="12" x2="3" y2="12"></line>
  <line x1="21" y1="12" x2="23" y2="12"></line>
  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <!-- Moon Icon (Show when light) -->
      <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
    </button>

    <!-- RTL Direction Toggle Button -->
    <button id="rtl-toggle" class="p-2.5 rounded-xl bg-gym-lightCard dark:bg-gym-darkCard border border-gym-lightBorder dark:border-gym-darkBorder text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-white shadow-sm transition-all duration-200 focus:outline-none" title="Switch Page Direction (LTR/RTL)" aria-label="Toggle layout direction">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
      </svg>
    </button>
  </div>

  <!-- 404 CARD CONTAINER -->
  <main class="max-w-2xl w-full text-center space-y-8 relative">
    
    <!-- Branding Logo -->
    <div class="flex justify-center">
      <a href="index.html" class="flex items-center space-x-2.5 group">
        <div class="relative flex items-center justify-center text-gym-brand group-hover:scale-110 transition-transform duration-300">
          <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="9" width="1.5" height="6" rx="0.5" fill="currentColor" stroke="none"/>
            <rect x="4.5" y="7" width="1.5" height="10" rx="0.5" fill="currentColor" stroke="none"/>
            <rect x="18" y="7" width="1.5" height="10" rx="0.5" fill="currentColor" stroke="none"/>
            <rect x="20.5" y="9" width="1.5" height="6" rx="0.5" fill="currentColor" stroke="none"/>
            <path d="M6 12h3.5l1.5-4.5L12.5 17l1.5-11 1.5 7.5L18 12" />
          </svg>
          <span class="absolute w-6 h-6 rounded-full bg-gym-brand/20 blur-md opacity-70 group-hover:opacity-100 transition-opacity duration-300"></span>
        </div>
        <span class="text-xl font-extrabold tracking-tight text-zinc-950 dark:text-white transition-colors duration-300">
          FIT<span class="text-gym-brand italic font-black">CORE</span>
        </span>
      </a>
    </div>

    <!-- Error Card -->
    <div class="bg-gym-lightCard dark:bg-gym-darkCard border border-gym-lightBorder dark:border-gym-darkBorder rounded-3xl overflow-hidden shadow-2xl p-8 sm:p-12 space-y-6 transition-all duration-300">
      
      <!-- Visual Display (Broken Barbell) -->
      <div class="relative rounded-2xl overflow-hidden border border-gym-lightBorder dark:border-gym-darkBorder max-w-lg mx-auto shadow-md">
        <img src="images/gym_404_bg.jpg" alt="Broken barbell 404" class="w-full h-[220px] object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/80 via-transparent to-transparent"></div>
        <span class="absolute bottom-4 start-4 text-xs font-black text-gym-brand bg-zinc-950/80 px-3 py-1 rounded-lg uppercase tracking-widest">
          Zone Limit Reached
        </span>
      </div>

      <!-- Text Content -->
      <div class="space-y-3">
        <h1 class="text-5xl font-black text-gym-brand tracking-tighter">404</h1>
        <h2 class="text-xl font-extrabold text-zinc-950 dark:text-white uppercase">SESSION TERMINATED</h2>
        <p class="text-sm font-semibold text-zinc-500 dark:text-zinc-400 max-w-md mx-auto leading-relaxed">
          It looks like you've strayed off your training program. The area you are attempting to access does not exist or has been relocated.
        </p>
      </div>

      <!-- Return Buttons -->
      <div class="pt-4 flex flex-col sm:flex-row gap-4 justify-center items-center">
        <a href="index.html" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3 text-sm font-bold text-white bg-gym-brand hover:bg-gym-brandHover rounded-xl shadow-md hover:shadow-lg shadow-gym-brand/20 transition-all duration-300">
          Return To Home
        </a>
        <a href="classes.html" class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3 text-sm font-bold text-zinc-700 dark:text-zinc-200 border border-gym-lightBorder dark:border-gym-darkBorder rounded-xl hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-colors">
          View Classes Schedule
        </a>
      </div>

    </div>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
    const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    const rtlToggleBtn = document.getElementById('rtl-toggle');

    const updateThemeUI = (isDark) => {
      if (isDark) {
        themeToggleLightIcon.classList.remove('hidden');
        themeToggleDarkIcon.classList.add('hidden');
      } else {
        themeToggleLightIcon.classList.add('hidden');
        themeToggleDarkIcon.classList.remove('hidden');
      }
    };

    const isCurrentlyDark = document.documentElement.classList.contains('dark');
    updateThemeUI(isCurrentlyDark);

    themeToggleBtn.addEventListener('click', () => {
      document.body.classList.add('theme-loading');
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
      setTimeout(() => {
        document.body.classList.remove('theme-loading');
      }, 100);
    });

    rtlToggleBtn.addEventListener('click', () => {
      const currentDir = document.documentElement.getAttribute('dir') === 'rtl' ? 'ltr' : 'rtl';
      document.documentElement.setAttribute('dir', currentDir);
      document.documentElement.setAttribute('lang', currentDir === 'rtl' ? 'ar' : 'en');
      localStorage.setItem('dir', currentDir);
    });
  </script>
</body>
</html>
