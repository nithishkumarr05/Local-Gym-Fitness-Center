<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>FitCore - Create Account</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Create your FitCore account. Access training dashboards, biometric telemetry, class bookings, and recovery suites.">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        gym: {
                            brand: '#FBBF24',
                            brandHover: '#D97706',
                            darkBg: '#09090B',
                            darkCard: '#18181B',
                            darkBorder: '#27272A',
                            lightBg: '#FAFAFA',
                            lightCard: '#FFFFFF',
                            lightBorder: '#E5E5E5',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #FAFAFA;
            color: #18181B;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            font-family: 'Montserrat', sans-serif;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,62,62,0.06) 0%, transparent 60%);
            padding: 1rem;
            box-sizing: border-box;
        }
        .dark body {
            background-color: #09090B;
            color: #E4E4E7;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,62,62,0.08) 0%, transparent 60%);
        }

        /* Toggles */
        .theme-toggle-wrapper {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }
        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 16px;
        }
        .toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.9);
            color: #52525B;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid #E5E5E5;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .dark .toggle-btn {
            background: rgba(24,24,27,0.9);
            color: #A1A1AA;
            border-color: #27272A;
        }
        .toggle-btn:hover {
            background: #FBBF24;
            color: #FFFFFF;
            transform: translateY(-1px);
            border-color: #FBBF24;
        }
        .dark .toggle-btn:hover {
            background: #FBBF24;
            color: #FFFFFF;
            border-color: #FBBF24;
        }

        /* Card */
        .signup-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 20px 60px rgba(255,62,62,0.08);
            border: 1px solid #E5E5E5;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .dark .signup-card {
            background: rgba(24,24,27,0.95);
            border-color: #27272A;
            box-shadow: 0 25px 60px rgba(0,0,0,0.55);
        }

        /* Inputs */
        .signup-input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            border-radius: 12px;
            border: 1.5px solid #E5E5E5;
            background: #FFFFFF;
            font-size: 0.9rem;
            transition: all 0.2s;
            color: #18181B;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            box-sizing: border-box;
        }
        .dark .signup-input {
            background: rgba(9,9,11,0.6);
            border-color: #27272A;
            color: #FAFAFA;
        }
        .signup-input::placeholder {
            color: #A1A1AA;
            font-weight: 500;
        }
        .dark .signup-input::placeholder { color: #71717A; }
        .signup-input:focus {
            outline: none;
            border-color: #FBBF24;
            box-shadow: 0 0 0 4px rgba(255,62,62,0.15);
        }
        .dark .signup-input:focus {
            border-color: #FBBF24;
            box-shadow: 0 0 0 4px rgba(255,62,62,0.2);
        }

        /* Password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper .signup-input {
            padding-right: 3rem;
        }
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #FBBF24;
            font-size: 0.95rem;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }
        .dark .toggle-password { color: #FBBF24; }
        .toggle-password:hover { color: #D97706; }
        [dir="rtl"] .toggle-password { right: auto; left: 1rem; }
        [dir="rtl"] .password-wrapper .signup-input { padding-right: 1.2rem; padding-left: 3rem; }
        [dir="rtl"] .input-icon { left: auto; right: 0; padding-left: 0; padding-right: 1rem; }

        /* Primary button */
        .btn-primary {
            background: #FBBF24;
            color: #fff;
            font-weight: 700;
            padding: 0.9rem 1.8rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            gap: 0.5rem;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255,62,62,0.35);
            background: #D97706;
        }

        /* Social */
        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 12px;
            border: 1.5px solid #E5E5E5;
            background: #FFFFFF;
            color: #18181B;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }
        .dark .social-btn {
            background: rgba(9,9,11,0.5);
            border-color: #27272A;
            color: #FAFAFA;
        }
        .social-btn:hover {
            background: rgba(255,62,62,0.06);
            border-color: #FBBF24;
            transform: translateY(-2px);
        }
        .dark .social-btn:hover {
            background: rgba(255,62,62,0.12);
            border-color: #FBBF24;
        }
        .social-btn i { color: #FBBF24; font-size: 1rem; }

        /* Logo */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        .logo-icon-box {
            position: relative;
            color: #FBBF24;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }
        .logo-wrapper:hover .logo-icon-box { transform: scale(1.1); }
        .logo-icon-box svg {
            width: 40px;
            height: 40px;
        }
        .logo-icon-box .glow {
            position: absolute;
            width: 28px;
            height: 28px;
            border-radius: 9999px;
            background: rgba(255,62,62,0.2);
            filter: blur(10px);
            opacity: 0.7;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #09090B;
            font-family: 'Montserrat', sans-serif;
            line-height: 1;
        }
        .dark .logo-text { color: #FAFAFA; }
        .logo-text .rise {
            color: #FBBF24;
            font-style: italic;
            font-weight: 900;
        }
        .logo-sub {
            font-size: 0.58rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #71717A;
            font-weight: 700;
            margin-top: 4px;
            display: block;
        }
        .dark .logo-sub { color: #A1A1AA; }

        .welcome-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #09090B;
            margin-top: 1rem;
            margin-bottom: 0.15rem;
            text-align: center;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }
        .dark .welcome-title { color: #FAFAFA; }
        .welcome-subtitle {
            font-size: 0.8rem;
            color: #52525B;
            text-align: center;
            margin-bottom: 0.3rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
        }
        .dark .welcome-subtitle { color: #A1A1AA; }

        .terms-text {
            font-size: 0.7rem;
            color: #52525B;
            line-height: 1.5;
            font-weight: 500;
        }
        .dark .terms-text { color: #A1A1AA; }
        .terms-link {
            color: #FBBF24;
            font-weight: 700;
            text-decoration: none;
        }
        .terms-link:hover { text-decoration: underline; color: #D97706; }
        .dark .terms-link { color: #FBBF24; }
        .dark .terms-link:hover { color: #F87171; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 0.9rem 0 0.7rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #E5E5E5;
        }
        .dark .divider::before, .dark .divider::after {
            border-bottom-color: #27272A;
        }
        .divider span {
            font-size: 0.65rem;
            padding: 0 0.8rem;
            color: #71717A;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        .dark .divider span { color: #A1A1AA; }

        .container-tight {
            max-width: 520px;
            width: 100%;
            padding: 0;
        }
        .hidden { display: none; }
        .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.6rem; }

        /* RTL */
        [dir="rtl"] .signup-input { padding: 0.85rem 3rem 0.85rem 1.2rem; }
        [dir="rtl"] .fa-arrow-right { transform: scaleX(-1); }

        /* Responsive */
        @media (max-width: 430px) {
            .signup-card { padding: 1.5rem 1.2rem; border-radius: 22px; }
            .logo-icon-box svg { width: 34px; height: 34px; }
            .logo-text { font-size: 1.3rem; }
            .welcome-title { font-size: 1.25rem; margin-top: 0.5rem; }
            .signup-input { padding: 0.65rem 0.9rem 0.65rem 2.6rem; font-size: 0.85rem; }
            .password-wrapper .signup-input { padding-right: 2.6rem; }
            .btn-primary { padding: 0.75rem 1rem; font-size: 0.85rem; }
            .social-btn { padding: 0.6rem 0.4rem; font-size: 0.8rem; }
            .theme-toggle-wrapper { top: 8px; right: 8px; }
            .toggle-btn { width: 34px; height: 34px; font-size: 0.8rem; }
        }
        @media (max-height: 800px) {
            .signup-card { padding: 1.4rem 1.6rem; }
            .logo-center { margin-bottom: 0.75rem; }
            .logo-icon-box svg { width: 34px; height: 34px; }
            .logo-text { font-size: 1.3rem; }
            .welcome-title { font-size: 1.25rem; margin-top: 0.4rem; }
            .welcome-subtitle { font-size: 0.75rem; }
            .signup-input { padding: 0.6rem 0.9rem 0.6rem 2.6rem; font-size: 0.85rem; }
            .password-wrapper .signup-input { padding-right: 2.6rem; }
            .btn-primary { padding: 0.7rem 1rem; font-size: 0.85rem; }
            .social-btn { padding: 0.55rem 0.4rem; font-size: 0.8rem; }
            .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.5rem; }
        }
        @media (max-height: 700px) {
            .signup-card { padding: 1rem 1.2rem; border-radius: 20px; }
            .logo-icon-box svg { width: 30px; height: 30px; }
            .logo-text { font-size: 1.15rem; }
            .logo-sub { display: none; }
            .welcome-title { font-size: 1.05rem; margin-top: 0; }
            .welcome-subtitle { display: none; }
            .signup-input { padding: 0.5rem 0.7rem 0.5rem 2.3rem; font-size: 0.8rem; }
            .btn-primary { padding: 0.55rem 0.8rem; font-size: 0.8rem; }
            .social-btn { padding: 0.45rem 0.3rem; font-size: 0.75rem; }
            .space-y-3 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.4rem; }
            .divider { margin: 0.5rem 0; }
        }
    </style>
</head>

<body>

    <!-- ===== THEME TOGGLES ===== -->
    <div class="theme-toggle-wrapper flex items-center gap-3">
        <button id="theme-toggle" class="toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
            <i class="fas fa-moon text-sm"></i>
            <i class="fas fa-sun text-sm hidden"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="Toggle RTL" aria-label="Toggle RTL">
            <i class="fas fa-exchange-alt text-sm"></i>
        </button>
    </div>

    <!-- ===== SIGNUP CARD ===== -->
    <div class="container-tight">
        <div class="signup-card animate-fade-in">

            <!-- LOGO -->
            <div class="logo-center mb-6">
                <a href="index.html" class="logo-wrapper">
                    <div class="logo-icon-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="9" width="1.5" height="6" rx="0.5" fill="currentColor" stroke="none"/>
                            <rect x="4.5" y="7" width="1.5" height="10" rx="0.5" fill="currentColor" stroke="none"/>
                            <rect x="18" y="7" width="1.5" height="10" rx="0.5" fill="currentColor" stroke="none"/>
                            <rect x="20.5" y="9" width="1.5" height="6" rx="0.5" fill="currentColor" stroke="none"/>
                            <path d="M6 12h3.5l1.5-4.5L12.5 17l1.5-11 1.5 7.5L18 12" />
                        </svg>
                        <span class="glow"></span>
                    </div>
                    <div class="flex flex-col items-start leading-none">
                        <span class="logo-text">
                            FIT<span class="rise">CORE</span>
                        </span>
                        <span class="logo-sub">Premium Gym & Fitness</span>
                    </div>
                </a>
                <h1 class="welcome-title">Join The Club</h1>
                <p class="welcome-subtitle">Create your account and start training smarter</p>
            </div>

            <!-- FORM -->
            <form id="signupForm" class="space-y-3" action="#" method="GET" novalidate>

                <!-- Full name -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#FBBF24] input-icon">
                        <i class="fas fa-user w-4 text-sm"></i>
                    </span>
                    <input type="text" id="fullName" name="name" placeholder="Full name" required
                        autocomplete="name"
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Emergency Contact / Referral -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#FBBF24] input-icon">
                        <i class="fas fa-heart-pulse w-4 text-sm"></i>
                    </span>
                    <input type="text" id="emergencyContact" name="emergency_contact" placeholder="Emergency contact (optional)"
                        autocomplete="off"
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Email -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#FBBF24] input-icon">
                        <i class="fas fa-envelope w-4 text-sm"></i>
                    </span>
                    <input type="email" id="email" name="email" placeholder="Email address" required
                        autocomplete="email"
                        class="signup-input text-sm md:text-sm">
                </div>

                <!-- Password -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#FBBF24] input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-password" name="password" placeholder="Password (min. 6 chars)" required
                        autocomplete="new-password"
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-password" aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Confirm password -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-[#FBBF24] input-icon">
                        <i class="fas fa-lock w-4 text-sm"></i>
                    </span>
                    <input type="password" id="signup-confirm-password" name="confirm_password" placeholder="Confirm password" required
                        autocomplete="new-password"
                        class="signup-input text-sm md:text-sm">
                    <button type="button" class="toggle-password" data-target="signup-confirm-password" aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- Terms -->
                <div class="flex items-start space-x-2 rtl:space-x-reverse mt-1">
                    <input type="checkbox" id="terms" required
                        class="mt-0.5 rounded border-zinc-300 dark:border-zinc-600 text-[#FBBF24] focus:ring-[#FBBF24]/30 dark:bg-zinc-700">
                    <label for="terms" class="terms-text">
                        I agree to the <a href="#" class="terms-link" id="termsLink">Membership Terms</a> and <a href="#" class="terms-link" id="privacyLink">Privacy Policy</a>
                    </label>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-primary mt-2">
                    Create Account <i class="fas fa-arrow-right ml-2 text-xs"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>Or sign up with</span>
            </div>

            <!-- Social -->
            <div class="flex gap-3">
                <button type="button" class="social-btn" id="googleSignupBtn" aria-label="Sign up with Google">
                    <i class="fab fa-google"></i> <span>Google</span>
                </button>
                <button type="button" class="social-btn" id="appleSignupBtn" aria-label="Sign up with Apple">
                    <i class="fab fa-apple"></i> <span>Apple</span>
                </button>
            </div>

            <!-- Login link -->
            <div class="mt-4 text-center">
                <span class="text-xs text-zinc-600 dark:text-zinc-400 font-medium">Already a member?</span>
                <a href="login.html" class="text-xs font-bold text-[#FBBF24] hover:text-[#D97706] ml-1 rtl:mr-1 hover:underline">
                    Sign in
                </a>
            </div>

        </div>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script>
        (function () {
            // ---------- THEME ----------
            const themeToggle = document.getElementById('theme-toggle');
            function setTheme(isDark) {
                document.documentElement.classList.toggle('dark', isDark);
                const moonIcon = themeToggle?.querySelector('.fa-moon');
                const sunIcon = themeToggle?.querySelector('.fa-sun');
                if (moonIcon && sunIcon) {
                    moonIcon.classList.toggle('hidden', isDark);
                    sunIcon.classList.toggle('hidden', !isDark);
                }
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') setTheme(true);
            else if (savedTheme === 'light') setTheme(false);
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setTheme(true);
            else setTheme(false);

            themeToggle?.addEventListener('click', (e) => {
                e.preventDefault();
                setTheme(!document.documentElement.classList.contains('dark'));
            });

            // ---------- RTL ----------
            const rtlBtn = document.getElementById('rtl-toggle');
            function setRTL(isRTL) {
                document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
                document.documentElement.lang = isRTL ? 'ar' : 'en';
                localStorage.setItem('dir', isRTL ? 'rtl' : 'ltr');
            }
            const savedDir = localStorage.getItem('dir');
            setRTL(savedDir === 'rtl');

            rtlBtn?.addEventListener('click', (e) => {
                e.preventDefault();
                setRTL(document.documentElement.dir !== 'rtl');
            });

            // ---------- PASSWORD EYE ----------
            document.querySelectorAll('.toggle-password').forEach(button => {
                button.addEventListener('click', function (e) {
                    e.preventDefault();
                    const input = document.getElementById(this.getAttribute('data-target'));
                    if (input) {
                        const isPassword = input.getAttribute('type') === 'password';
                        input.setAttribute('type', isPassword ? 'text' : 'password');
                        const icon = this.querySelector('i');
                        if (icon) {
                            icon.classList.toggle('fa-eye-slash', !isPassword);
                            icon.classList.toggle('fa-eye', isPassword);
                        }
                    }
                });
            });

            // ---------- TOAST ----------
            function showToast(msg, type = 'info') {
                document.getElementById('simple-toast')?.remove();
                const toast = document.createElement('div');
                toast.id = 'simple-toast';
                const colors = {
                    info: '#FBBF24',
                    error: '#B43B2E',
                    warning: '#D4A22E',
                    success: '#0F8B6F'
                };
                toast.style.cssText = `
                    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
                    background: ${colors[type] || colors.info}; color: white;
                    padding: 0.75rem 1.25rem; border-radius: 12px;
                    font-size: 0.85rem; font-weight: 600; font-family: 'Montserrat', sans-serif;
                    box-shadow: 0 12px 30px rgba(0,0,0,0.25); z-index: 9999;
                    opacity: 0; transition: opacity 0.3s ease;
                    max-width: 90vw; text-align: center;
                `;
                toast.textContent = msg;
                document.body.appendChild(toast);
                requestAnimationFrame(() => { toast.style.opacity = '1'; });
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 350);
                }, 2600);
            }

            // ---------- SOCIAL ----------
            document.getElementById('googleSignupBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('Google sign-up coming soon. Use email to get started.', 'info');
            });
            document.getElementById('appleSignupBtn')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('Apple sign-up coming soon. Use email to get started.', 'info');
            });

            // ---------- TERMS ----------
            document.getElementById('termsLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('FitCore Membership Terms would be displayed here.', 'info');
            });
            document.getElementById('privacyLink')?.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('FitCore Privacy Policy would be displayed here.', 'info');
            });

            // ---------- FORM SUBMIT ----------
            document.getElementById('signupForm')?.addEventListener('submit', function (e) {
                e.preventDefault();
                const fullName = document.getElementById('fullName')?.value.trim();
                const email = document.getElementById('email')?.value.trim();
                const password = document.getElementById('signup-password')?.value;
                const confirm = document.getElementById('signup-confirm-password')?.value;
                const termsCheck = document.getElementById('terms');

                if (!fullName || fullName.length < 2) {
                    showToast('Please enter your full name', 'warning');
                    return;
                }

                const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    showToast('Please enter a valid email address', 'error');
                    return;
                }

                if (!password || password.length < 6) {
                    showToast('Password must be at least 6 characters', 'warning');
                    return;
                }

                if (password !== confirm) {
                    showToast('Passwords do not match. Please re-enter.', 'error');
                    return;
                }

                if (!termsCheck.checked) {
                    showToast('Please accept the Membership Terms and Privacy Policy.', 'warning');
                    return;
                }

                const firstName = fullName.split(' ')[0];
                showToast(`Welcome to FitCore, ${firstName}! Your account is ready.`, 'success');
                // Uncomment to redirect:
                // setTimeout(() => { window.location.href = 'login.html'; }, 1200);
            });
        })();
    </script>
</body>
</html>
